<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#04060a" />
    <title>Dagyard · laboratorio de la escena</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600&family=Geist+Mono:wght@400;500&display=swap" />
    <style>
      /* Réplica mínima del HUD del preview para validar el encuadre a ojo; la interfaz real vive en src/ui. */
      :root {
        --ink: #04060a; --line: #1c2636; --star: #f4eee2; --work: #9fd3ff; --amber: #ffb547; --mute: #6b7a93; --text: #d9e1ec;
        --font-body: "Geist", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
        --font-mono: "Geist Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
        color-scheme: dark;
      }
      html, body { height: 100%; margin: 0; }
      body { background: #000; color: var(--text); font-family: var(--font-body); overflow: hidden; -webkit-font-smoothing: antialiased; }
      #frame { position: fixed; inset: 0; background: var(--ink); overflow: hidden; }
      #frame.boxed { inset: auto; left: 50%; top: 50%; transform: translate(-50%, -50%); outline: 1px solid #1c2636; }
      canvas#c { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
      #labels { position: absolute; inset: 0; pointer-events: none; z-index: 2; }
      .hud { position: absolute; z-index: 3; }
      #brand { top: 18px; left: 20px; display: grid; gap: 6px; }
      #brand .word { font: 13px var(--font-mono); letter-spacing: .32em; color: var(--star); display: flex; align-items: center; gap: 10px; }
      #brand .word i { width: 7px; height: 7px; border-radius: 50%; background: var(--work); box-shadow: 0 0 10px var(--work); }
      #brand .proj { font-size: 20px; font-weight: 500; letter-spacing: -.01em; }
      #brand .now { font: 11px var(--font-mono); letter-spacing: .08em; color: var(--mute); text-transform: uppercase; }
      #brand .now b { color: var(--work); font-weight: 500; }
      #actions { top: 18px; right: 20px; display: flex; gap: 8px; }
      .btn { font: 500 12px/1 var(--font-mono); letter-spacing: .06em; text-transform: uppercase; color: var(--text); background: rgba(10,15,23,.72); border: 1px solid var(--line); padding: 10px 12px; border-radius: 999px; display: inline-flex; gap: 8px; align-items: center; cursor: pointer; }
      .btn.amber { color: var(--amber); border-color: rgba(255,181,71,.45); }
      .btn.amber i { width: 7px; height: 7px; border-radius: 50%; background: var(--amber); box-shadow: 0 0 10px var(--amber); }
      #rail { left: 20px; right: 20px; bottom: 18px; display: flex; gap: 6px; }
      .stage { flex: 1 0 0; min-width: 0; padding: 8px 2px 0; color: var(--mute); display: grid; gap: 6px; font-family: var(--font-mono); cursor: pointer; background: none; border: 0; text-align: left; }
      .stage .bar { height: 2px; background: var(--line); position: relative; }
      .stage .bar span { position: absolute; inset: 0 auto 0 0; background: var(--star); opacity: .8; }
      .stage .nm { font-size: 11px; letter-spacing: .1em; text-transform: uppercase; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--mute); }
      .stage .ct { font-size: 10px; color: #48556b; }
      #safe { position: absolute; z-index: 1; border: 1px dashed rgba(255, 80, 120, .55); pointer-events: none; display: none; }
      .debug #safe { display: block; }
      @media (max-width: 720px) {
        #brand { left: 16px; } #brand .proj { font-size: 16px; }
        #actions { top: 70px; right: 16px; }
        #brand .now { display: none; }
        #rail { left: 16px; right: 16px; overflow: hidden; }
        .stage { flex: 0 0 96px; }
      }
      #frame.narrow #brand { left: 16px; } #frame.narrow #brand .proj { font-size: 16px; }
      #frame.narrow #actions { top: 70px; right: 16px; }
      #frame.narrow #brand .now { display: none; }
      #frame.narrow #rail { left: 16px; right: 16px; overflow: hidden; }
      #frame.narrow .stage { flex: 0 0 96px; }
    </style>
  </head>
  <body>
    <div id="frame">
      <canvas id="c" aria-label="El plan del proyecto como una constelación"></canvas>
      <div id="labels"></div>
      <div id="safe"></div>
      <div id="brand" class="hud">
        <div class="word"><i></i>dagyard</div>
        <div class="proj">Marketplace de reservas</div>
        <div class="now">5 de 20 listas · ahora en <b>II Diseño · III Construcción</b></div>
      </div>
      <div id="actions" class="hud">
        <button class="btn amber" id="waiting" type="button"><i></i>3 te esperan</button>
        <button class="btn" id="overview" type="button">Vista general</button>
      </div>
      <nav id="rail" class="hud" aria-label="Etapas del proyecto"></nav>
    </div>
    <script type="module" src="/src/scene/lab.ts"></script>
  </body>
</html>
