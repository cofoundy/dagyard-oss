# Dagyard — API + UI en un solo Worker. Secrets (nunca en este archivo): OWNER_TOKEN, AGENT_KEY, VAULT_KEY.
name = "dagyard"
main = "src/index.ts"
compatibility_date = "2026-08-22"
compatibility_flags = ["nodejs_compat"]

[vars]
VERSION = "dev"

[assets]
directory = "./public"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

# Sin D1 (el token de Cloudflare no tiene permiso): el SQL vive en un DO singleton con SQLite.
[[durable_objects.bindings]]
name = "STORE"
class_name = "Store"

[[durable_objects.bindings]]
name = "PROJECT_ROOM"
class_name = "ProjectRoom"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Store", "ProjectRoom"]
