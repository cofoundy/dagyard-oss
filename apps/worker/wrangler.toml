# Dagyard — API + UI en un solo Worker. Secrets (nunca en este archivo): OWNER_TOKEN, AGENT_KEY, VAULT_KEY.
name = "dagyard"
main = "src/index.ts"
compatibility_date = "2026-08-22"
compatibility_flags = ["nodejs_compat"]

[vars]
VERSION = "dev"

[assets]
directory = "./public"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

[[d1_databases]]
binding = "DB"
database_name = "dagyard"
database_id = "<<D1_ID>>"
migrations_dir = "migrations"

[[durable_objects.bindings]]
name = "PROJECT_ROOM"
class_name = "ProjectRoom"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["ProjectRoom"]
