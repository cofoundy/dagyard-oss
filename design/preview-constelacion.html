<title>Dagyard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600&family=Geist+Mono:wght@400;500&display=swap">
<style>
/* Layout: el cielo ocupa toda la pantalla; HUD mínimo en las esquinas, carril de etapas abajo, ficha del nodo a la derecha (hoja inferior en móvil). */
:root {
  --ink: #04060a;        /* cielo */
  --panel: #0a0f17;      /* ficha */
  --line: #1c2636;       /* hairlines, grilla */
  --star: #f4eee2;       /* hecho */
  --work: #9fd3ff;       /* trabajando */
  --amber: #ffb547;      /* te espera */
  --mute: #6b7a93;       /* en cola, texto secundario */
  --text: #d9e1ec;
  --font-body: "Geist", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "Geist Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  color-scheme: dark;
}
html, body { height: 100%; }
body { background: var(--ink); color: var(--text); font-family: var(--font-body); overflow: hidden; -webkit-font-smoothing: antialiased; }
#app { position: fixed; inset: 0; }
canvas#c { position: absolute; inset: 0; width: 100%; height: 100%; display: block; cursor: grab; touch-action: none; }
canvas#c.drag { cursor: grabbing; }
canvas#c.hover { cursor: pointer; }

.mono { font-family: var(--font-mono); }
.hud { position: absolute; z-index: 3; pointer-events: none; }
.hud > * { pointer-events: auto; }

/* arriba izquierda */
#brand { top: calc(18px + env(safe-area-inset-top, 0px)); left: 20px; display: grid; gap: 6px; max-width: min(60vw, 520px); }
#brand .word { font-family: var(--font-mono); font-size: 13px; letter-spacing: .32em; text-transform: lowercase; color: var(--star); display: flex; align-items: center; gap: 10px; }
#brand .word i { width: 7px; height: 7px; border-radius: 50%; background: var(--work); box-shadow: 0 0 10px var(--work); animation: beat 2.4s ease-in-out infinite; }
#brand .proj { font-size: 20px; font-weight: 500; letter-spacing: -.01em; color: var(--text); text-wrap: balance; }
#brand .now { font-family: var(--font-mono); font-size: 11px; letter-spacing: .08em; color: var(--mute); text-transform: uppercase; }
#brand .now b { color: var(--work); font-weight: 500; }

/* arriba derecha */
#actions { top: calc(18px + env(safe-area-inset-top, 0px)); right: 20px; display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }
.btn { font: 500 12px/1 var(--font-mono); letter-spacing: .06em; text-transform: uppercase; color: var(--text); background: rgba(10,15,23,.72); border: 1px solid var(--line); padding: 10px 12px; border-radius: 999px; cursor: pointer; display: inline-flex; align-items: center; gap: 8px; backdrop-filter: blur(6px); transition: border-color .2s, color .2s; }
.btn:hover { border-color: #33435c; }
.btn:focus-visible, button:focus-visible, input:focus-visible { outline: 1px solid var(--work); outline-offset: 2px; }
#waiting { color: var(--amber); border-color: rgba(255,181,71,.45); }
#waiting .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--amber); box-shadow: 0 0 10px var(--amber); animation: beat 1.4s ease-in-out infinite; }
#waiting.calm { color: var(--mute); border-color: var(--line); }
#waiting.calm .dot { background: var(--mute); box-shadow: none; animation: none; }

/* carril de etapas */
#rail { left: 20px; right: 20px; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; }
#rail::-webkit-scrollbar { display: none; }
.stage { flex: 1 0 120px; min-width: 0; background: none; border: 0; padding: 8px 2px 0; color: var(--mute); text-align: left; cursor: pointer; display: grid; gap: 6px; font-family: var(--font-mono); }
.stage .bar { height: 2px; background: var(--line); position: relative; overflow: visible; }
.stage .bar span { position: absolute; inset: 0 auto 0 0; background: var(--star); opacity: .8; transition: width .8s cubic-bezier(.2,.8,.2,1); }
.stage .bar em { position: absolute; top: -3px; width: 8px; height: 8px; border-radius: 50%; left: -1px; display: none; }
.stage.active .bar em { display: block; background: var(--work); box-shadow: 0 0 8px var(--work); animation: beat 1.8s infinite; }
.stage.blocked .bar em { display: block; background: var(--amber); box-shadow: 0 0 8px var(--amber); animation: beat 1.2s infinite; }
.stage .nm { font-size: 11px; letter-spacing: .1em; text-transform: uppercase; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.stage .ct { font-size: 10px; color: #48556b; font-variant-numeric: tabular-nums; }
.stage.active .nm, .stage.blocked .nm { color: var(--text); }
.stage.sel .nm { color: var(--star); }

#note { left: 20px; bottom: calc(76px + env(safe-area-inset-bottom, 0px)); font: 10px/1.4 var(--font-mono); letter-spacing: .06em; color: #3f4b5f; text-transform: uppercase; }

/* etiquetas de nodos */
#labels { position: absolute; inset: 0; pointer-events: none; z-index: 2; overflow: hidden; }
.lbl { position: absolute; left: 0; top: 0; transform: translate(-50%, 0); white-space: nowrap; font-family: var(--font-body); font-size: 12px; letter-spacing: 0; color: var(--mute); transition: opacity .35s; text-align: center; }
.lbl b { font-weight: 500; color: inherit; }
.lbl span { display: block; font-family: var(--font-body); font-size: 12px; letter-spacing: 0; color: var(--text); margin-top: 3px; max-width: 220px; overflow: hidden; text-overflow: ellipsis; opacity: 0; transition: opacity .3s; }
.lbl.show span { opacity: 1; }
.lbl.done { color: #b9b2a5; }
.lbl.working { color: var(--work); }
.lbl.blocked { color: var(--amber); }
.slbl { position: absolute; left: 0; top: 0; transform: translate(-50%, -50%); font-family: var(--font-mono); font-size: 10px; letter-spacing: .28em; color: #55657e; text-transform: uppercase; white-space: nowrap; }

/* ficha del nodo */
#card { position: absolute; z-index: 4; top: calc(84px + env(safe-area-inset-top, 0px)); right: 20px; width: min(360px, calc(100vw - 40px)); max-height: calc(100% - 190px); overflow: auto; background: linear-gradient(180deg, rgba(12,18,28,.94), rgba(8,12,19,.94)); border: 1px solid var(--line); border-radius: 14px; padding: 18px; display: grid; gap: 14px; transform: translateX(12px); opacity: 0; pointer-events: none; transition: opacity .35s, transform .45s cubic-bezier(.2,.8,.2,1); backdrop-filter: blur(10px); }
#card.open { opacity: 1; transform: none; pointer-events: auto; }
#card .top { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
#card .cat { font: 500 11px var(--font-mono); letter-spacing: .14em; color: var(--mute); text-transform: uppercase; }
#card .x { background: none; border: 0; color: var(--mute); font: 18px/1 var(--font-mono); cursor: pointer; padding: 4px 6px; }
#card h2 { margin: 0; font-size: 19px; line-height: 1.3; font-weight: 500; letter-spacing: -.01em; text-wrap: balance; color: var(--star); }
.chip { font: 500 10px/1 var(--font-mono); letter-spacing: .12em; text-transform: uppercase; padding: 6px 9px; border-radius: 999px; border: 1px solid var(--line); display: inline-flex; gap: 6px; align-items: center; width: max-content; }
.chip.done { color: var(--star); }
.chip.working { color: var(--work); border-color: rgba(159,211,255,.35); }
.chip.blocked { color: var(--amber); border-color: rgba(255,181,71,.45); }
.chip.queued { color: var(--mute); }
.msg { display: grid; gap: 6px; padding-left: 12px; border-left: 1px solid var(--line); }
.msg .who { font: 11px var(--font-mono); color: var(--mute); letter-spacing: .04em; }
.msg p { margin: 0; font-size: 14px; line-height: 1.5; color: var(--text); }
.prog { height: 3px; background: var(--line); border-radius: 2px; overflow: hidden; }
.prog span { display: block; height: 100%; background: var(--work); box-shadow: 0 0 10px var(--work); transition: width .4s; }
.deps { display: flex; flex-wrap: wrap; gap: 6px; }
.deps button { font: 11px var(--font-mono); color: var(--mute); background: none; border: 1px solid var(--line); border-radius: 6px; padding: 5px 7px; cursor: pointer; }
.deps button.ok { color: #b9b2a5; }
.deps button:hover { color: var(--text); border-color: #33435c; }
.sec { font: 10px var(--font-mono); letter-spacing: .14em; text-transform: uppercase; color: #48556b; }
.block { border: 1px solid rgba(255,181,71,.35); background: rgba(255,181,71,.05); border-radius: 10px; padding: 14px; display: grid; gap: 10px; }
.block p { margin: 0; font-size: 14px; line-height: 1.5; color: var(--text); }
.block label { font: 11px var(--font-mono); color: var(--amber); letter-spacing: .08em; }
.block input { width: 100%; box-sizing: border-box; background: var(--ink); color: var(--text); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; font: 13px var(--font-mono); }
.block .opts { display: grid; gap: 8px; }
.go { font: 500 12px/1 var(--font-mono); letter-spacing: .08em; text-transform: uppercase; color: var(--ink); background: var(--amber); border: 0; border-radius: 8px; padding: 12px; cursor: pointer; transition: filter .2s; }
.go:hover { filter: brightness(1.08); }
.go.ghost { background: none; color: var(--amber); border: 1px solid rgba(255,181,71,.45); }
.fine { font-size: 11px; line-height: 1.45; color: var(--mute); margin: 0; }
.report { font: 12px var(--font-mono); color: var(--mute); display: flex; justify-content: space-between; border-top: 1px solid var(--line); padding-top: 12px; }

/* avisos */
#toasts { top: calc(18px + env(safe-area-inset-top, 0px)); left: 50%; transform: translateX(-50%); display: grid; gap: 8px; justify-items: center; width: min(440px, calc(100vw - 40px)); pointer-events: none; }
.toast { font-size: 13px; color: var(--text); background: rgba(10,15,23,.88); border: 1px solid var(--line); border-radius: 999px; padding: 9px 14px; display: flex; gap: 10px; align-items: center; animation: tin .5s cubic-bezier(.2,.8,.2,1); backdrop-filter: blur(6px); max-width: 100%; }
.toast b { font: 500 11px var(--font-mono); letter-spacing: .06em; }
.toast.done b { color: var(--star); } .toast.work b { color: var(--work); } .toast.amber b { color: var(--amber); }
.toast.out { opacity: 0; transform: translateY(-6px); transition: all .4s; }

#fallback { position: absolute; inset: 0; display: grid; place-items: center; padding: 24px; text-align: center; color: var(--mute); font-family: var(--font-mono); font-size: 13px; }

@keyframes beat { 0%,100% { opacity: 1; } 50% { opacity: .35; } }
@keyframes tin { from { opacity: 0; transform: translateY(-8px); } to { opacity: 1; transform: none; } }

@media (max-width: 720px) {
  #brand .proj { font-size: 16px; }
  #toasts { top: auto; bottom: calc(84px + env(safe-area-inset-bottom, 0px)); }
  #card { top: auto; bottom: calc(76px + env(safe-area-inset-bottom, 0px)); right: 16px; left: 16px; width: auto; max-height: 52%; transform: translateY(14px); }
  #rail { left: 16px; right: 16px; }
  .stage { flex-basis: 96px; }
  #note { display: none; }
  #actions { top: calc(70px + env(safe-area-inset-top, 0px)); right: 16px; }
  #brand { left: 16px; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}
</style>

<div id="app">
  <canvas id="c" aria-label="El plan del proyecto como una constelación"></canvas>
  <div id="labels"></div>

  <div id="brand" class="hud">
    <div class="word"><i></i>dagyard</div>
    <div class="proj">Marketplace de reservas</div>
    <div class="now" id="now"></div>
  </div>

  <div id="actions" class="hud">
    <button class="btn" id="waiting" type="button"><span class="dot"></span><span id="waitTxt"></span></button>
    <button class="btn" id="overview" type="button">Vista general</button>
  </div>

  <div id="toasts" class="hud"></div>

  <aside id="card" aria-live="polite"></aside>

  <div id="note" class="hud">Preview · proyecto de ejemplo</div>
  <nav id="rail" class="hud" aria-label="Etapas del proyecto"></nav>
</div>

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>

<script type="module">
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

const REDUCED = matchMedia('(prefers-reduced-motion: reduce)').matches;
const ROMAN = ['I','II','III','IV','V','VI','VII'];
const COL = { done: 0xf4eee2, working: 0x9fd3ff, blocked: 0xffb547, queued: 0x8494ad };

/* ---------- datos: títulos reales de .cofoundy/tasks del orchestrator; estados simulados ---------- */
const STAGES = [
  { name: 'Descubrimiento' }, { name: 'Diseño' }, { name: 'Construcción' }, { name: 'Pruebas' }, { name: 'Lanzamiento' },
];
const TEAM = ['Investigación', 'Diseño', 'Construcción', 'Pruebas', 'Lanzamiento'];
const NODES = [
  { id:'entrevistas', s:0, t:'Entrevistas a 8 usuarios', st:'done', deps:[], agent:'Investigación', msg:'Listo. El dolor #1 es no saber si hay disponibilidad antes de llamar.' },
  { id:'competencia', s:0, t:'Análisis de la competencia', st:'done', deps:[], agent:'Investigación', msg:'Revisé 6 apps. Ninguna muestra disponibilidad en tiempo real.' },
  { id:'usuario', s:0, t:'Definir el usuario principal', st:'done', deps:['entrevistas','competencia'], agent:'Investigación', msg:'Elegimos al cliente que reserva desde el celular, entre semana.' },
  { id:'registro-d', s:1, t:'Flujo de registro', st:'done', deps:['usuario'], agent:'Diseño', msg:'Registro en 2 pasos, con Google o con correo.' },
  { id:'busqueda-d', s:1, t:'Pantalla de búsqueda', st:'done', deps:['usuario'], agent:'Diseño', msg:'Filtros por zona, precio y horario disponible.' },
  { id:'comision', s:1, t:'Modelo de comisiones', st:'blocked', deps:['competencia'], agent:'Diseño',
    block:{ kind:'decision', q:'¿A quién le cobramos la comisión?', opts:['Al proveedor (10 % por reserva)','Al cliente (cargo de servicio)'] } },
  { id:'checkout-d', s:1, t:'Diseño del pago', st:'blocked', deps:['busqueda-d'], agent:'Diseño',
    block:{ kind:'review', q:'Terminé el diseño del pago en 3 pantallas. Revísalo antes de que lo construyamos.', opts:['Aprobar','Pedir cambios'] } },
  { id:'perfil-d', s:1, t:'Perfil del proveedor', st:'working', p:.55, deps:['usuario'], agent:'Diseño', msg:'Armando la galería de fotos y las reseñas. Mañana te lo paso para revisar.' },
  { id:'registro', s:2, t:'Registro e inicio de sesión', st:'working', p:.68, deps:['registro-d'], agent:'Construcción', msg:'Ya entra con Google. Me falta el correo de bienvenida.' },
  { id:'buscador', s:2, t:'Buscador con filtros', st:'working', p:.3, deps:['busqueda-d'], agent:'Construcción', msg:'Los filtros ya responden. Ahora conecto la disponibilidad real.' },
  { id:'pagos', s:2, t:'Pagos con tarjeta', st:'blocked', deps:[], agent:'Construcción',
    block:{ kind:'secret', key:'Clave de la pasarela de pagos', q:'Necesito acceso a la cuenta de la pasarela de pagos para cobrar con tarjeta.' } },
  { id:'reservas', s:2, t:'Reservas y calendario', st:'queued', deps:['buscador','perfil-d'] },
  { id:'whatsapp', s:2, t:'Avisos por WhatsApp', st:'queued', deps:['registro'] },
  { id:'panel', s:2, t:'Panel del proveedor', st:'queued', deps:['perfil-d','comision'] },
  { id:'prueba-users', s:3, t:'Prueba con 5 usuarios reales', st:'queued', deps:['reservas','registro'] },
  { id:'prueba-pagos', s:3, t:'Prueba de pagos de punta a punta', st:'queued', deps:['pagos','checkout-d'] },
  { id:'velocidad', s:3, t:'Revisión de velocidad en celular', st:'queued', deps:['buscador'] },
  { id:'landing', s:4, t:'Página de lanzamiento', st:'queued', deps:['usuario'] },
  { id:'tiendas', s:4, t:'Publicar en App Store y Play Store', st:'queued', deps:['prueba-users','prueba-pagos','velocidad'] },
  { id:'anuncio', s:4, t:'Anuncio a la lista de espera', st:'queued', deps:['tiendas','landing'] },
];
const byId = Object.fromEntries(NODES.map(n => [n.id, n]));
const DONE_LINES = ['Listo. Dejé el informe en Basalt.','Terminado y revisado por Pruebas.','Hecho; ya lo puedes ver en el link de prueba.'];
const START_LINES = ['Arranco con esto.','Lo tomé; te aviso si necesito algo.','Empiezo. Primero reviso lo que dejó el equipo anterior.'];

/* ---------- renderer ---------- */
const canvas = document.getElementById('c');
let renderer;
try {
  renderer = new THREE.WebGLRenderer({ canvas, antialias: true, powerPreference: 'high-performance' });
} catch (e) {
  document.getElementById('app').insertAdjacentHTML('beforeend', '<div id="fallback">Este navegador no tiene WebGL. Ábrelo en Chrome, Safari o Firefox de escritorio.</div>');
  throw e;
}
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x04060a);
scene.fog = new THREE.FogExp2(0x04060a, 0.0065);
const camera = new THREE.PerspectiveCamera(48, 1, 0.1, 2000);

const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
const bloom = new UnrealBloomPass(new THREE.Vector2(1, 1), 0.8, 0.38, 0.16);
composer.addPass(bloom);
composer.addPass(new OutputPass());

/* ---------- texturas generadas ---------- */
function tex(draw, size = 256) {
  const c = document.createElement('canvas'); c.width = c.height = size;
  const g = c.getContext('2d'); draw(g, size);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; return t;
}
const T_GLOW = tex((g, s) => {
  const r = g.createRadialGradient(s/2, s/2, 0, s/2, s/2, s/2);
  r.addColorStop(0, 'rgba(255,255,255,1)'); r.addColorStop(.08, 'rgba(255,255,255,.9)');
  r.addColorStop(.22, 'rgba(255,255,255,.28)'); r.addColorStop(.5, 'rgba(255,255,255,.06)'); r.addColorStop(1, 'rgba(255,255,255,0)');
  g.fillStyle = r; g.fillRect(0, 0, s, s);
});
const T_SPIKE = tex((g, s) => {
  // picos de difracción de un reflector con soporte de 4 brazos
  const m = s / 2;
  for (const [dx, dy] of [[1,0],[0,1]]) {
    const lg = g.createLinearGradient(m - dx*m, m - dy*m, m + dx*m, m + dy*m);
    lg.addColorStop(0, 'rgba(255,255,255,0)'); lg.addColorStop(.42, 'rgba(255,255,255,.18)');
    lg.addColorStop(.5, 'rgba(255,255,255,.95)'); lg.addColorStop(.58, 'rgba(255,255,255,.18)'); lg.addColorStop(1, 'rgba(255,255,255,0)');
    g.strokeStyle = lg; g.lineWidth = s * 0.012;
    g.beginPath(); g.moveTo(m - dx*m, m - dy*m); g.lineTo(m + dx*m, m + dy*m); g.stroke();
  }
});
const T_RING = tex((g, s) => {
  g.strokeStyle = 'rgba(255,255,255,1)'; g.lineWidth = s * 0.018;
  g.beginPath(); g.arc(s/2, s/2, s*0.42, 0, Math.PI*2); g.stroke();
  // marcas de retícula, como la de un buscador
  g.lineWidth = s * 0.012;
  for (let i = 0; i < 4; i++) {
    const a = i * Math.PI / 2;
    g.beginPath(); g.moveTo(s/2 + Math.cos(a)*s*0.36, s/2 + Math.sin(a)*s*0.36); g.lineTo(s/2 + Math.cos(a)*s*0.48, s/2 + Math.sin(a)*s*0.48); g.stroke();
  }
});
const T_DOT = tex((g, s) => {
  const r = g.createRadialGradient(s/2, s/2, 0, s/2, s/2, s/2);
  r.addColorStop(0, 'rgba(255,255,255,1)'); r.addColorStop(.35, 'rgba(255,255,255,.5)'); r.addColorStop(1, 'rgba(255,255,255,0)');
  g.fillStyle = r; g.fillRect(0, 0, s, s);
}, 64);

function sprite(map, color, opacity = 1) {
  const m = new THREE.SpriteMaterial({ map, color, transparent: true, opacity, depthWrite: false, blending: THREE.AdditiveBlending });
  return new THREE.Sprite(m);
}

/* ---------- cielo de fondo: campo estelar + grilla celeste ---------- */
function starfield(count, rMin, rMax, size, opacity) {
  const pos = new Float32Array(count * 3), col = new Float32Array(count * 3);
  const warm = new THREE.Color(0xffe2c0), cool = new THREE.Color(0xc8dcff), w = new THREE.Color(0xffffff), tmp = new THREE.Color();
  for (let i = 0; i < count; i++) {
    const u = Math.random() * 2 - 1, th = Math.random() * Math.PI * 2, r = rMin + Math.random() * (rMax - rMin);
    const sq = Math.sqrt(1 - u*u);
    pos.set([r * sq * Math.cos(th), r * u, r * sq * Math.sin(th)], i * 3);
    const k = Math.random();
    tmp.copy(w).lerp(k < .5 ? warm : cool, Math.random() * .6).multiplyScalar(.35 + Math.random() * .65);
    col.set([tmp.r, tmp.g, tmp.b], i * 3);
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  g.setAttribute('color', new THREE.BufferAttribute(col, 3));
  const m = new THREE.PointsMaterial({ size, map: T_DOT, vertexColors: true, transparent: true, opacity, depthWrite: false, blending: THREE.AdditiveBlending, fog: false, sizeAttenuation: true });
  return new THREE.Points(g, m);
}
const sky = new THREE.Group();
sky.add(starfield(4200, 380, 700, 2.2, .75));
sky.add(starfield(900, 300, 600, 4.2, .55));
scene.add(sky);

(function grid() {
  const R = 260, pts = [];
  for (let lat = -75; lat <= 75; lat += 15) {

/* ---------- loop ---------- */
const clock = new THREE.Clock();
const v3 = new THREE.Vector3();

addEventListener('resize', resize); resize();

  }

  sky.rotation.y += dt * 0.002;

  // simulación de la fábrica
  if (mode !== 'intro') {
    simAcc += dt;
    NODES.forEach(n => {
      if (n.st === 'working') {
        n.p += dt * n.speed;
        if (n.p >= 1) complete(n);
        else if (focusId === n.id) { const pe = document.getElementById('prog'); if (pe) pe.style.width = Math.round(n.p * 100) + '%'; }
      }

  }

  const rel = new Set();

  // nodos
  NODES.forEach(n => {
    n.pos.lerp(n.home, 1 - Math.pow(0.02, dt)); n.group.position.copy(n.pos);

    n.dim += ((focusId && !rel.has(n.id) ? 0.18 : 1) - n.dim) * Math.min(1, dt * 4);
    n.color.lerp(new THREE.Color(COL[n.st]), Math.min(1, dt * 2.5));
    n.flash = Math.max(0, (n.flash || 0) - dt * 1.2);

    n.spike.material.rotation = 0.12;

    if (e.draw < 61) { e.draw = Math.min(61, e.draw + dt * 40); e.line.geometry.setDrawRange(0, Math.floor(e.draw)); }
    const a = byId[e.from], b = byId[e.to];
    const pts = e.curve; pts.v0.copy(a.pos); pts.v2.copy(b.pos);
    pts.v1.copy(a.pos).add(b.pos).multiplyScalar(.5); pts.v1.y += 1.2 + a.pos.distanceTo(b.pos) * 0.06;
    const moving = a.pos.distanceToSquared(a.home) > 1e-4 || b.pos.distanceToSquared(b.home) > 1e-4;
    if (moving || a.born < 1 || b.born < 1) { e.line.geometry.setFromPoints(pts.getPoints(60)); e.line.computeLineDistances(); e.line.geometry.setDrawRange(0, Math.floor(e.draw)); }
    const d = focusId ? (rel.has(e.from) && rel.has(e.to) && (e.from === focusId || e.to === focusId) ? 1.8 : .25) : 1;
    e.mat.opacity = Math.min(1, e.baseO * d);
  });

  // partículas
  const active = edges.filter(e => byId[e.from].st === 'done' && byId[e.to].st === 'working');
  for (let k = 0; k < PCOUNT; k++) {
    if (!active.length) { pPos[k*3+1] = 9999; continue; }
    const e = active[k % active.length], u = ((t * 0.22) + k * 0.6180339) % 1;
    e.curve.getPoint(u, v3); pPos.set([v3.x, v3.y, v3.z], k * 3);
  }
  pGeo.attributes.position.needsUpdate = true;
  pMat.opacity = focusId ? .45 : .85;

  // etiquetas
  const w = innerWidth, h = innerHeight;
  NODES.forEach(n => {
    v3.copy(n.pos); v3.y -= 1.25; v3.project(camera);
    const vis = v3.z < 1 && Math.abs(v3.x) < 1.15 && Math.abs(v3.y) < 1.15;
    const dist = camera.position.distanceTo(n.pos);
    const near = dist < 30 || n.id === hoverId || n.id === focusId;
    const loud = n.st === 'working' || n.st === 'blocked';
    let o = vis ? (focusId ? (rel.has(n.id) ? 1 : .1) : (dist < 40 ? 1 : n.st === 'blocked' ? .95 : n.id === hoverId ? 1 : 0)) : 0;
    if (n.born < 1) o *= n.born;
    n.lbl.style.opacity = o.toFixed(2);
    n.lbl.style.transform = `translate(${(v3.x * .5 + .5) * w}px, ${(-v3.y * .5 + .5) * h}px) translate(-50%, 0)`;
    n.lbl.classList.toggle('show', near && vis);
  });
  STAGES.forEach((s, i) => {
    v3.copy(stageCenter(i)); v3.z += s.ringR + 1.4; v3.project(camera);
    const vis = v3.z < 1;
    stageLabels[i].style.opacity = vis ? (focusId ? .25 : .9) : 0;
    stageLabels[i].style.transform = `translate(${(v3.x * .5 + .5) * w}px, ${(-v3.y * .5 + .5) * h}px) translate(-50%, -50%)`;
  });

  composer.render();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
