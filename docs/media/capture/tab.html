<!doctype html><meta charset="utf-8"><style>
body{margin:0;background:transparent;font-family:-apple-system,'SF Pro Text','Segoe UI',sans-serif}
.win{margin:28px;width:1100px;border-radius:12px;overflow:hidden;box-shadow:0 0 0 1px #2c2c2c,0 24px 60px rgba(0,0,0,.55);background:#000}
.strip{height:44px;background:#1f1f1f;display:flex;align-items:flex-end;padding:0 10px 0 86px;position:relative;gap:2px}
.dots{position:absolute;left:16px;top:16px;display:flex;gap:8px}.dots i{width:12px;height:12px;border-radius:50%}
.tab{height:34px;width:230px;display:flex;align-items:center;gap:9px;padding:0 14px;border-radius:9px 9px 0 0;font-size:13px;color:#9a9a9a}
.tab.on{background:#353535;color:#f2f2f2}.tab img{width:16px;height:16px}
.tab .x{margin-left:auto;color:#8a8a8a;font-size:13px}
.plus{color:#8a8a8a;font-size:20px;padding:0 10px 6px}
.page{height:300px;background:url(data:image/png;base64,{{SHOT}}) top left/1100px auto no-repeat}
</style><div class="win"><div class="strip"><div class="dots"><i style="background:#ff5f57"></i><i style="background:#febc2e"></i><i style="background:#28c840"></i></div>
<div class="tab"><span style="width:16px;height:16px;border-radius:4px;background:#4a4a4a"></span><span>Pull requests</span><span class="x">×</span></div>
<div class="tab on"><img src="{{ICON}}"><span>{{TITLE}}</span><span class="x">×</span></div>
<div class="plus">+</div></div><div class="page"></div></div>
